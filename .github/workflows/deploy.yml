name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # id-token: write permite pedir credenciales temporales por OIDC. No hay claves de larga duración.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias y CDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
          npm install -g aws-cdk@2

      - name: Asumir el rol de despliegue (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar el stack de aplicación
        run: |
          cdk deploy EstadisticasAppStack \
            --require-approval never \
            -c github_repo=${{ github.repository }} \
            -c alert_email=${{ vars.ALERT_EMAIL }}
